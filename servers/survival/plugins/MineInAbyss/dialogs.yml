gondola_unlock_ww:
  characterName: Warka
  pages:
    - lines:
        - "Hello there delver!"
    - lines:
        - "I can give you permanent access"
        - "to this gondola route for 32"
        - "Orth Coins."
    - lines:
        - "Would you like to purchase access?"
      answers:
        - text: "Yes"
          replyMessage: "Awesome, step onto the gondola and I'll send you down!"
          action: GONDOLA
        - text: "No"
          replyMessage: "No problem, see you around!"
