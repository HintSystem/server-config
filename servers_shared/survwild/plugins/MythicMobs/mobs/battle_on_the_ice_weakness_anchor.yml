battle_on_the_ice_weakness_anchor:
  Type: PIG
  Display: "<red>Average Sports Fan"
  AIGoalSelectors:
    - clear
    - lookatplayers
  AITargetSelectors:
    - clear
  Health: 9999
  Damage: 0
  Options:
    Silent: true
    PreventOtherDrops: true
    Collidable: false
    KnockbackResistance: 1
    Invincible: true
  Model:
    Id: guildmaster
    ViewRadius: 40
    Drive: false
    DamageTint: false
    Scale: 1

  DamageModifiers:
    - FALL 0.001
    - DROWNING 0.001
    - ENTITY_SWEEP_ATTACK 0.001
  Skills:
    - skill{s=boti_sound_cooldown} @self ~onInteract
    - skill{s=boti_weakness_cooldown} @trigger ~onInteract
    - skill{s=boti_toast_cooldown} @PIR{r=3} ~onInteract
    - speak{offset=0.5;radius=30;maxlinelength=30;lineprefix="&5";message=" <b>Right click for weakness. Good luck!";chatprefix=<caster.name>&f<&co>;duration=10000;sendchatmessage=false} @self ~onSpawn
    - speak{offset=1.5;radius=30;maxlinelength=30;lineprefix="&5";message=" <b>Right click for weakness. Good luck!";chatprefix=<caster.name>&f<&co>;duration=10000;sendchatmessage=false} @self ~onTimer:10000