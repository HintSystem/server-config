    - actionmessage{m="<#17D8C5>du du du du dum tick";d=120} @self
    - effect:particles{particle=redstone;color=#17D8C5;amount=20;hS=0.5;vS=0.5;y=1.5} @forward{f=1.5}

ghost_seek_chicken_1:
