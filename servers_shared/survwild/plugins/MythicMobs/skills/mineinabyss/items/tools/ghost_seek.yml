# These particles aid with users that can't hear or have sound turned off,
# They are ordered same as the ghost seek chimes, with 1 being the lowest signal, to 5 being the highest.
# They follow colors from red, orange, yellow, green, teal,
# with increasing saturation at each step.
ghost_seek_effect_1:
  Skills:
    - randomskill{skills= ghost_seek_normal_1 15, ghost_seek_chicken_1}

ghost_seek_effect_2:
  Skills:
    - randomskill{skills= ghost_seek_normal_2 15, ghost_seek_chicken_2}

ghost_seek_effect_3:
  Skills:
    - randomskill{skills= ghost_seek_normal_3 15, ghost_seek_chicken_3}

ghost_seek_effect_4:
  Skills:
    - randomskill{skills= ghost_seek_normal_4 15, ghost_seek_chicken_4}

ghost_seek_effect_5:
  Skills:
    - randomskill{skills= ghost_seek_normal_5 15, ghost_seek_chicken_5}

ghost_seek_normal_1:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek.ping1;sc=ui;volume=1.3} @self
    - actionmessage{m="<#32365d>dum tick";d=120} @self
    - effect:particles{particle=redstone;color=#000435;amount=6;hS=0.5;vS=0.5;y=1.5} @forward{f=1.5}
ghost_seek_normal_2:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek.ping2;sc=ui;volume=1.3} @self
    - actionmessage{m="<#5B62A5>du dum tick";d=120} @self
    - effect:particles{particle=redstone;color=#5B62A5;amount=8;hS=0.5;vS=0.5;y=1.5} @forward{f=1.5}
ghost_seek_normal_3:
