set.item:
  itemName: <gold>Repaired Ghost Seek
  type: minecraft:paper
  itemModel: mineinabyss:ghost_seek_on
  lore:
    - <#D2D489>A mysterious device attuned to the lingering souls of the Abyss.
    - <#D2D489>Its ethereal hum grows louder as it nears a praying skeleton,
    - <#D2D489>guiding its wielder toward hidden relics.
  equippable:
    slot: HEAD
    cameraOverlay: mineinabyss:misc/ghost_seek_overlay
passive:
  - match:
      - equipped
    every: 13s
    run:
      - become: parent
      - geary:ghost_seek:
          radii:
            250:
              - playSound: { sound: mineinabyss:item.ghost_seek_1 }
              - mythicSkills:
                  - skill{s=ghost_seek_particles_1} @self
            150:
              - playSound: { sound: mineinabyss:item.ghost_seek_2 }
              - mythicSkills:
                  - skill{s=ghost_seek_particles_2} @self
            100:
              - playSound: { sound: mineinabyss:item.ghost_seek_3 }
              - mythicSkills:
                  - skill{s=ghost_seek_particles_3} @self
            50:
              - playSound: { sound: mineinabyss:item.ghost_seek_4 }
              - mythicSkills:
                  - skill{s=ghost_seek_particles_4} @self
            25:
              - playSound: { sound: mineinabyss:item.ghost_seek_5 }
              - mythicSkills:
                  - skill{s=ghost_seek_particles_5} @self
                  - skill{s=ghost_seek_glow_nearby} @self
resourcepack:
  model: mineinabyss:item/relics/ghost_seek_on
