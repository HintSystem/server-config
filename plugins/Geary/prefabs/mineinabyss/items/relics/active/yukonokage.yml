set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:yukonokage
  itemName: <#c7f9ff><b>Yukonokage
  lore:
  - ':layer_5: Grade I Relic'
  - <#80d0d9>A cursed scythe crafted from a forgotten 
  - <#80d0d9>relic ore that feeds on the essence of the living.
  - <#83a0a3><i>Each swing with its jagged blade rends not 
  - <#83a0a3><i>just flesh—but the soul itself. When
  - <#83a0a3><i>right-clicked and crouching, the scythe unleashes 
  - <#83a0a3><i>the pent-up souls in a violent burst of
  - <#83a0a3><i>spectral energy, tearing through all nearby life.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - mythicSkills:
    - yukonokage_hit
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=yukonokage_souls} true
    onFail:
    - sendActionBar:
        text: <red>You have insufficient souls
  - cooldown:
      id: yukonokage
      length: 5s
      display: <#617B94>Yukonokage
  - mythicSkills:
    - yukonokage_ability
passive:
- match:
  - inHand
  every: 1s
  run:
  - become: parent 
  - mythicSkills:
    - yukonokage_soul_display
resourcepack:
  model: mineinabyss:item/relics/yukonokage