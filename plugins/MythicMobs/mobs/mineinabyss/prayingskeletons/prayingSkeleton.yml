prayingSkeleton_base:
  Type: PIG
  Display: "<green>Praying Skeleton"
  AIGoalSelectors:
    - clear
  AITargetSelectors:
    - clear
  Health: 5
  Damage: 0
  Options:
    Silent: true
    PreventOtherDrops: true
    Collidable: false
    KnockbackResistance: 1
  Skills:
    # Choose a random model for this skeleton
    - randomskill{skills=
      [- model{modelid=praying_skeleton_1;radius=100;damagetint=false;drive=false} @self],
      [- model{modelid=praying_skeleton_2;radius=100;damagetint=false;drive=false} @self],
      [- model{modelid=praying_skeleton_3;radius=100;damagetint=false;drive=false} @self],
      [- model{modelid=praying_skeleton_4;radius=100;damagetint=false;drive=false} @self],
      [- model{modelid=praying_skeleton_5;radius=100;damagetint=false;drive=false} @self]
      } @self ~onSpawn
    - skill{s=displayHealth} ~onDamaged
