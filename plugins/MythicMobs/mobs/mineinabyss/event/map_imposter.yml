


spawnrandomamongus:
  Type: SILVERFISH
  SpawnCategory: skeleton
  Display: "<green>Imposter"
  Modules:
    ThreatTable: true
  AIGoalSelectors:
    - clear
  AITargetSelectors:
    - clear
  Health: 5 # change this
  Damage: 0 # keep this 0
  Options:
    PreventSunburn: true
    Silent: true
    PreventOtherDrops: true
    FollowRange: 15
    MovementSpeed: 0   # replaced with skills
    KnockbackResistance: 1.0
    Collidable: false
    Despawn: false
    Persistent: true
    Invisibile: true
  Skills:
  - skill{s=spawnrandomimpostermap} @self ~onspawn
  - remove{delay=5} @Self ~onSpawn

green_impostermap:
  Type: SILVERFISH
  #Disguise: ARMOR_STAND setInvisible
  Display: 'an Imposter'
  Health: 13
  AITargetSelectors:
  - players
  Options:
    Marker: true
    Silent: true
    PreventBlockInfection: true
    PreventOtherDrops: true
    MovementSpeed: 0.3
  Drops:
  - exp 5-15
  - amogus_token 1 0.5
  Skills:
  - skill{s=kys} @self ~onSignal:kys
  - remove{delay=1} @Self ~onSignal:kys
  - skill{s=imposter_greenSPAWN} @self ~onSpawn
  - skill{s=imposter_greenATTACKsyncmap;sync=true} @self ~onAttack
  - skill{s=imposter_greenDEATH} @self ~onDeath
  - skill{s=imposter_greenSHOOTmap} @self ~onTimer:20
  - model{mid=imposter_green;d=false;i=true} @self ~onSpawn
  - model{mid=imposter_green;d=false;i=true} @self ~onLoad 
  
