
hb_dash:
  Cooldown: 25
  Conditions:
    - offgcd true
    - targetinlineofsight
    - incombat true
  #- stance{s=spikeless;str=true} false
  Skills:
    - gcd{ticks=220}
    - effect:particlering{particle=BLOCKCRACK;material=DIRT;radius=1;points=10;amount=30;hS=1;vS=1} @Self
    # - setai{ai=false}
    - stun{d=50;f=true} @self


    - delay 20
    - state{s=charge_windup;li=0;lo=0} @self
    - look{headOnly=false;immediately=false;repeat=100;repeatinterval=1} @target
    - delay 30
    - setspeed{speed=1.2;type=walking} @self
    - state{s=charge_windup;r=true} @self
    - state{s=charge_run;li=0;lo=0} @self
    #- look{headOnly=false;immediately=false;repeat=100;repeatinterval=1} @target
    - totem{md=2;c=1;oH=hb_dashhit;hnp=false;hp=true;hR=1;vR=2;i=1;repeat=100;repeatinterval=1} @forward{f=1}
    - delay 60
    - state{s=charge_run;remove=true} @self
    - skill{s=hc_dashmiss} @self
    - setspeed{speed=1;type=walking} @self
    - delay 50

    #- setai{ai=true}
hb_dashhit:
  Cooldown: 6
  Conditions:
    - targetwithin 3
  Skills:
    - setAI{ai=false} @self
    - state{s=charge_hit;li=0;lo=0} @self
    - setstance{stance=dashhit} @self
    # - shieldbreak{duration=200} @target
    - damage{a=8}
    - throw{v=5;vy=18}
    - state{s=charge_hit;li=0;lo=0;r=true} @self
    - state{s=spikedown;li=0;lo=0} @self

    - potion{type=SLOW_FALLING;duration=35;level=1} @self
    - delay 5
    - throw{v=5;vy=18} @self
    - delay 10

    - velocity{m=set;x=0;y=0;z=0} @self
    - velocity{m=add;x=0;y=0.15;z=0} @self
    - velocity{m=set;x=0;y=0;z=0} @target
    - velocity{m=add;x=0;y=0.15;z=0} @target
    - damage{a=10;ie=true}
    - leap{velocity=60} @forward{f=2;y=-5}
    - delay 25
    - state{s=spikedown;li=0;lo=0;r=true} @self
    - setAI{ai=true} @self
   # - sound{s=entity.warden.attack_impact;sc=master;p=<random.float.0.2to0.5>;v=0.7} @self

hb_dashmiss:
  Conditions:
    - stance{s=dashhit} false
  Skills:
    - stun{d=20;f=true} @self
    - state{s=charge_miss;li=0;lo=0} @self
    - delay 40
    - state{s=charge_miss;remove=true} @self
    - setstance{stance=normal} @self



