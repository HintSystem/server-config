foolscradlethrow:
  Cooldown: 0
  Conditions:
    - offgcd true
  Skills:
    - gcd{ticks=50}
    - projectile{bulletType=ITEM;material=redstone;onHit=foolscradle_impact;v=25;g=0.85;i=1;hR=1;vR=1;hnp=true;syo=1.5} @targetlocation


foolscradle_impact:
  Skills:
    - effect:particles{particle=angry_villager;amount=1;hS=.25;vS=.5;y=.5;repeat=120;repeatInterval=7}
    - effect:particles{particle=raid_omen;amount=2;hS=.25;vS=.5;y=.5;repeat=120;repeatInterval=7}
    - summon{type=fapukuon;amount=1;radius=3} @target
    - summon{type=red_imposter_map;amount=1;radius=3} @target
    - effect:totemundying @PlayersInRadius{r=5}
    - effect:spin @PlayersInRadius{r=5}